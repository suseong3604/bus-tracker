<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 전세버스 위치 추적 및 노선 관리 시스템</title>

  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?libraries=places,geometry"></script>

  <!-- Firebase SDK (v9/v10 Compat Library) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --danger: #ef4444;
      --header-bg: #1e293b;
      --header-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #10b981;
      --danger: #f87171;
      --header-bg: #020617;
      --header-text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }

    /* Header */
    header { background-color: var(--header-bg); color: var(--header-text); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; flex-shrink: 0; }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-area h1 { font-size: 1.1rem; font-weight: 700; }
    .badge-driver { background: #e11d48; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-passenger { background: #059669; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .route-selector select { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }

    /* Buttons */
    .btn { padding: 6px 12px; border-radius: 6px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: transparent; color: var(--header-text); border: 1px solid rgba(255,255,255,0.3); }
    .btn-secondary:hover { background-color: rgba(255,255,255,0.1); }
    .btn-theme { background: transparent; color: var(--header-text); font-size: 1.2rem; border: none; cursor: pointer; padding: 4px; }

    /* Main Content Area */
    .main-container { display: flex; flex: 1; position: relative; overflow: hidden; height: calc(100vh - 60px); }

    /* Map Area */
    #map-container { flex: 1; position: relative; height: 100%; }
    #map { width: 100%; height: 100%; }

    /* Admin Floating Controls (Driver Only) */
    .driver-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--card-bg); padding: 12px 20px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); display: flex; gap: 10px; align-items: center; border: 1px solid var(--border-color); }
    .gps-status { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; margin-right: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.active { background: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Sidebar / Route Panel */
    .sidebar { width: 360px; background-color: var(--card-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 5; height: 100%; overflow: hidden; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .sidebar-header h2 { font-size: 1rem; color: var(--text-color); }
    .sidebar-admin-actions { padding: 10px 16px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; flex-shrink: 0; }

    /* 정류장 리스트 스크롤 영역 */
    .stop-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; min-height: 0; }
    .stop-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
    .stop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stop-name { font-weight: 700; font-size: 0.95rem; color: var(--text-color); }
    .stop-time { font-size: 0.8rem; color: var(--text-muted); background: var(--card-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); }
    .stop-eta { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 4px; display: flex; justify-content: space-between; }
    .stop-actions { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; align-items: center; }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); color: var(--text-color); width: 90%; max-width: 420px; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h3 { margin-bottom: 15px; font-size: 1.1rem; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 0.9rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    /* Responsive */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; height: calc(100vh - 60px); }
      .sidebar { width: 100%; height: 50%; order: 2; flex-shrink: 0; }
      #map-container { height: 50%; order: 1; flex-shrink: 0; }
      .driver-controls { bottom: 10px; width: 92%; justify-content: center; padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-area">
      <span>🚌</span>
      <h1>전세버스 실시간 위치 추적</h1>
      <span id="user-badge" class="badge-passenger">승객 (조회 전용)</span>
    </div>

    <div class="header-actions">
      <!-- 노선 선택 -->
      <div class="route-selector">
        <select id="route-select" onchange="switchRoute(this.value)"></select>
      </div>

      <!-- 다크/라이트 모드 버튼 -->
      <button id="btn-theme" class="btn-theme" onclick="toggleTheme()" title="테마 변경">☀️</button>

      <!-- 관리자 로그인 / 로그아웃 / 비밀번호 변경 / 공유 -->
      <button id="btn-login-modal" class="btn btn-secondary" onclick="openLoginModal()">기사님 로그인</button>
      <button id="btn-change-pw-modal" class="btn btn-secondary" onclick="openChangePwModal()" style="display:none;">🔑 비밀번호 변경</button>
      <button id="btn-logout" class="btn btn-secondary" onclick="logout()" style="display:none;">로그아웃</button>
      <button class="btn btn-primary" onclick="copyShareLink()">🔗 공유 링크</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Map Container -->
    <div id="map-container">
      <div id="map"></div>

      <!-- 기사님 전용 GPS 컨트롤러 -->
      <div id="driver-controls" class="driver-controls" style="display: none;">
        <div class="gps-status">
          <div id="gps-dot" class="dot"></div>
          <span id="gps-text">GPS 정지됨</span>
        </div>
        <button id="btn-toggle-gps" class="btn btn-primary" onclick="toggleGPS()">📡 내 위치 추적 시작</button>
      </div>
    </div>

    <!-- Sidebar: 노선 및 정류장 관리 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>📍 정류장 정보</h2>
        <button id="btn-add-stop-modal" class="btn btn-primary" onclick="openAddStopModal()" style="display:none;">+ 정류장 추가</button>
      </div>
      
      <!-- 관리자 전용 노선 편집 버튼 영역 -->
      <div id="sidebar-admin-actions" class="sidebar-admin-actions" style="display:none;">
        <button class="btn btn-secondary" style="color:var(--text-color); font-size:0.75rem;" onclick="openAddRouteModal()">➕ 새 노선 추가</button>
        <button class="btn btn-secondary" style="color:var(--text-color); font-size:0.75rem;" onclick="openEditRouteModal()">✏️ 현재 노선명 수정</button>
        <button class="btn btn-secondary" style="color:var(--danger); font-size:0.75rem;" onclick="deleteCurrentRoute()">🗑️ 노선 삭제</button>
      </div>

      <!-- 정류장 리스트 영역 -->
      <div id="stop-list" class="stop-list">
        <!-- 정류장 리스트가 동적으로 삽입됩니다 -->
      </div>
    </div>
  </div>

  <!-- Modal 1: 기사님 로그인 -->
  <div id="modal-login" class="modal-overlay">
    <div class="modal">
      <h3>🔒 기사님 관리자 로그인</h3>
      <div class="form-group">
        <label>관리자 비밀번호</label>
        <input type="password" id="login-password" placeholder="비밀번호를 입력하세요" onkeyup="if(event.key==='Enter') login()">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="color:var(--text-color);" onclick="closeModal('modal-login')">취소</button>
        <button class="btn btn-primary" onclick="login()">로그인</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: 비밀번호 변경 -->
  <div id="modal-change-pw" class="modal-overlay">
    <div class="modal">
      <h3>🔑 관리자 비밀번호 변경</h3>
      <div class="form-group">
        <label>현재 비밀번호</label>
        <input type="password" id="pw-current" placeholder="현재 비밀번호">
      </div>
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" id="pw-new" placeholder="새 비밀번호 입력">
      </div>
      <div class="form-group">
        <label>새 비밀번호 확인</label>
        <input type="password" id="pw-new-confirm" placeholder="새 비밀번호 재입력" onkeyup="if(event.key==='Enter') saveNewPassword()">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="color:var(--text-color);" onclick="closeModal('modal-change-pw')">취소</button>
        <button class="btn btn-primary" onclick="saveNewPassword()">변경 완료</button>
      </div>
    </div>
  </div>

  <!-- Modal 3: 정류장 추가/수정 -->
  <div id="modal-stop" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-stop-title">📍 정류장 설정</h3>
      <input type="hidden" id="stop-edit-id">
      <div class="form-group">
        <label>정류장 이름</label>
        <input type="text" id="stop-name" placeholder="예: 수원역 4번 출구">
      </div>
      <div class="form-group">
        <label>기존 예정 시각 (옵션)</label>
        <input type="text" id="stop-scheduled-time" placeholder="예: 08:30">
      </div>
      <div class="form-group">
        <label>위도 (Latitude)</label>
        <input type="text" id="stop-lat" placeholder="지도를 클릭하면 자동 입력됩니다">
      </div>
      <div class="form-group">
        <label>경도 (Longitude)</label>
        <input type="text" id="stop-lng" placeholder="지도를 클릭하면 자동 입력됩니다">
      </div>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">* 지도 위를 클릭하면 해당 위치의 위도/경도가 자동 입력됩니다.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="color:var(--text-color);" onclick="closeModal('modal-stop')">취소</button>
        <button class="btn btn-primary" onclick="saveStop()">저장</button>
      </div>
    </div>
  </div>

  <!-- Modal 4: 노선 추가/수정 -->
  <div id="modal-route" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-route-title">🚌 노선 관리</h3>
      <div class="form-group">
        <label>노선 이름</label>
        <input type="text" id="route-name-input" placeholder="예: 출근 1호선, 야간 퇴근 노선">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="color:var(--text-color);" onclick="closeModal('modal-route')">취소</button>
        <button class="btn btn-primary" onclick="saveRoute()">저장</button>
      </div>
    </div>
  </div>

  <!-- Script Core -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCQPrquXqMQ6flQWDB0xds97GNd4i8znyw",
      authDomain: "my-bus-tracker-5df7d.firebaseapp.com",
      databaseURL: "https://my-bus-tracker-5df7d-default-rtdb.firebaseio.com",
      projectId: "my-bus-tracker-5df7d",
      storageBucket: "my-bus-tracker-5df7d.firebasestorage.app",
      messagingSenderId: "257826789238",
      appId: "1:257826789238:web:faac10150041e5088d4c57",
      measurementId: "G-N61N3XD4SB"
    };

    let db = null;
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }

    const ADMIN_PASSWORD_KEY = 'bus_admin_password';
    let isAdmin = false;
    let isDarkTheme = false;

    let defaultRoutes = {
      "route-1": {
        id: "route-1",
        name: "출근 셔틀 1호선",
        stops: [
          { id: 1, name: "수원역 4번 출구", lat: 37.2660, lng: 127.0007, scheduledTime: "08:00" },
          { id: 2, name: "인계동 동수원사거리", lat: 37.2755, lng: 127.0275, scheduledTime: "08:15" },
          { id: 3, name: "광교중앙역", lat: 37.2885, lng: 127.0515, scheduledTime: "08:35" }
        ]
      }
    };

    let routes = JSON.parse(localStorage.getItem('bus_routes')) || defaultRoutes;
    let currentRouteId = Object.keys(routes)[0] || "route-1";

    let map, busMarker, polyline;
    let stopMarkers = [];
    let watchId = null;
    let currentBusLocation = null;
    let currentBusSpeed = 0; // m/s 단위 속도 저장 변수

    window.onload = function() {
      if(!localStorage.getItem(ADMIN_PASSWORD_KEY)) {
        localStorage.setItem(ADMIN_PASSWORD_KEY, '1234');
      }
      initMap();
      renderRouteSelect();
      renderStopList();
      initFirebaseListeners();
    };

    function initFirebaseListeners() {
      if (!db) return;

      db.ref("bus_location").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data && data.lat && data.lng) {
          updateBusPositionUI(data.lat, data.lng, data.speed || 0);
        }
      });

      db.ref("bus_routes").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          routes = data;
          Object.keys(routes).forEach(rKey => {
            if (!routes[rKey].stops) routes[rKey].stops = [];
          });
          localStorage.setItem('bus_routes', JSON.stringify(routes));
          if (!routes[currentRouteId]) {
            currentRouteId = Object.keys(routes)[0] || "route-1";
          }
          renderRouteSelect();
          updateMapRoute();
          renderStopList();
        } else {
          syncRoutesToCloud();
        }
      });
    }

    function syncRoutesToCloud() {
      localStorage.setItem("bus_routes", JSON.stringify(routes));
      if (db) {
        db.ref("bus_routes").set(routes).catch((error) => {
          console.error("데이터 저장 실패: ", error);
        });
      }
    }

    function initMap() {
      const defaultCenter = { lat: 37.2755, lng: 127.0275 };
      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultCenter,
        zoom: 13,
        zoomControl: true
      });

      map.addListener("click", (e) => {
        if(!isAdmin) return;
        const lat = e.latLng.lat().toFixed(6);
        const lng = e.latLng.lng().toFixed(6);
        
        openAddStopModal();
        document.getElementById("stop-lat").value = lat;
        document.getElementById("stop-lng").value = lng;
      });

      updateMapRoute();
    }

    function updateMapRoute() {
      if(!map) return;
      stopMarkers.forEach(m => m.setMap(null));
      stopMarkers = [];
      if(polyline) polyline.setMap(null);

      const currentStops = routes[currentRouteId]?.stops || [];
      const pathCoordinates = [];

      currentStops.forEach((stop, index) => {
        const pos = { lat: parseFloat(stop.lat), lng: parseFloat(stop.lng) };
        pathCoordinates.push(pos);

        const marker = new google.maps.Marker({
          position: pos,
          map: map,
          title: stop.name,
          label: { text: `${index + 1}`, color: "white", fontWeight: "bold" },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 14,
            fillColor: "#2563eb",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
        stopMarkers.push(marker);
      });

      if(pathCoordinates.length > 1) {
        polyline = new google.maps.Polyline({
          path: pathCoordinates,
          geodesic: true,
          strokeColor: "#3b82f6",
          strokeOpacity: 0.8,
          strokeWeight: 4
        });
        polyline.setMap(map);
      }
    }

    function updateBusPositionUI(lat, lng, speed) {
      currentBusLocation = { lat, lng };
      currentBusSpeed = speed; // 속도 업데이트 (m/s)
      const busPos = new google.maps.LatLng(lat, lng);

      if(!busMarker) {
        busMarker = new google.maps.Marker({
          position: busPos,
          map: map,
          title: "전세버스 위치",
          icon: {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
            scale: 2,
            fillColor: "#ef4444",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
      } else {
        busMarker.setPosition(busPos);
      }
      calculateETA();
    }

    function sendBusPositionToCloud(lat, lng, speed) {
      updateBusPositionUI(lat, lng, speed);
      if (db) {
        db.ref("bus_location").set({
          lat: lat,
          lng: lng,
          speed: speed,
          timestamp: Date.now()
        });
      }
    }

    // 속도와 거리를 반영한 현실적인 ETA 계산 로직
    function calculateETA() {
      if(!currentBusLocation) return;
      const currentStops = routes[currentRouteId]?.stops || [];

      currentStops.forEach(stop => {
        const stopPos = new google.maps.LatLng(stop.lat, stop.lng);
        const busPos = new google.maps.LatLng(currentBusLocation.lat, currentBusLocation.lng);
        const distanceMeters = google.maps.geometry.spherical.computeDistanceBetween(busPos, stopPos);
        const distanceKm = (distanceMeters / 1000).toFixed(1);

        const etaElem = document.getElementById(`eta-${stop.id}`);
        if(etaElem) {
          if(distanceMeters < 100) {
            etaElem.innerHTML = `<span style="color:var(--accent);">🎉 잠시 후 도착!</span>`;
          } else {
            let estimatedMinutes = 0;
            // 만약 기사님의 현재 속도가 유의미하게 측정되고 있다면 (약 5km/h 이상인 경우) 속도 기반 계산
            if (currentBusSpeed && currentBusSpeed > 1.39) { 
              const speedKmh = currentBusSpeed * 3.6; // m/s를 km/h로 변환
              estimatedMinutes = Math.ceil((distanceMeters / 1000) / speedKmh * 60);
            } else {
              // 속도가 멈춰있거나 안 잡힐 때는 시내 주행 평균 속도(30km/h) 기준 적용
              estimatedMinutes = Math.ceil((distanceMeters / 1000) / 30 * 60);
            }
            estimatedMinutes = Math.max(1, estimatedMinutes); // 최소 1분 보장
            etaElem.innerText = `약 ${estimatedMinutes}분 소요 (${distanceKm} km)`;
          }
        }
      });
    }

    function renderRouteSelect() {
      const select = document.getElementById("route-select");
      select.innerHTML = "";
      Object.keys(routes).forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.innerText = routes[key].name;
        if(key === currentRouteId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchRoute(routeId) {
      currentRouteId = routeId;
      updateMapRoute();
      renderStopList();
    }

    function renderStopList() {
      const listContainer = document.getElementById("stop-list");
      listContainer.innerHTML = "";

      if(!routes[currentRouteId]) return;
      if(!routes[currentRouteId].stops) {
        routes[currentRouteId].stops = [];
      }

      const currentStops = routes[currentRouteId].stops;
      if(currentStops.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px;">등록된 정류장이 없습니다.</p>`;
        return;
      }

      currentStops.forEach((stop, index) => {
        const div = document.createElement("div");
        div.className = "stop-item";
        div.innerHTML = `
          <div class="stop-header">
            <span class="stop-name">${index + 1}. ${stop.name}</span>
            <span class="stop-time">${stop.scheduledTime || '시각 미정'}</span>
          </div>
          <div class="stop-eta">
            <span>도착 예정:</span>
            <span id="eta-${stop.id}">위치 수신 대기 중...</span>
          </div>
          ${isAdmin ? `
            <div class="stop-actions">
              <button class="btn btn-secondary" style="color:var(--text-color); font-size:0.75rem;" onclick="moveStop(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.4;"' : ''}>⬆️ 위로</button>
              <button class="btn btn-secondary" style="color:var(--text-color); font-size:0.75rem;" onclick="moveStop(${index}, 1)" ${index === currentStops.length - 1 ? 'disabled style="opacity:0.4;"' : ''}>⬇️ 아래로</button>
              <button class="btn btn-secondary" style="color:var(--text-color); font-size:0.75rem;" onclick="openEditStopModal(${stop.id})">✏️ 수정</button>
              <button class="btn btn-secondary" style="color:var(--danger); font-size:0.75rem;" onclick="deleteStop(${stop.id})">🗑️ 삭제</button>
            </div>
          ` : ''}
        `;
        listContainer.appendChild(div);
      });
    }

    function openAddRouteModal() {
      if(!isAdmin) return;
      isEditingRouteName = false;
      document.getElementById("modal-route-title").innerText = "➕ 새 노선 추가";
      document.getElementById("route-name-input").value = "";
      document.getElementById("modal-route").classList.add("active");
    }

    function openEditRouteModal() {
      if(!isAdmin) return;
      isEditingRouteName = true;
      document.getElementById("modal-route-title").innerText = "✏️ 현재 노선명 수정";
      document.getElementById("route-name-input").value = routes[currentRouteId].name;
      document.getElementById("modal-route").classList.add("active");
    }

    function saveRoute() {
      if(!isAdmin) return;
      const name = document.getElementById("route-name-input").value.trim();
      if(!name) {
        alert("노선 이름을 입력해주세요.");
        return;
      }

      if(isEditingRouteName) {
        routes[currentRouteId].name = name;
      } else {
        const newId = "route-" + Date.now();
        routes[newId] = {
          id: newId,
          name: name,
          stops: []
        };
        currentRouteId = newId;
      }

      syncRoutesToCloud();
      closeModal("modal-route");
      renderRouteSelect();
      updateMapRoute();
      renderStopList();
    }

    function deleteCurrentRoute() {
      if(!isAdmin) return;
      const routeKeys = Object.keys(routes);
      if(routeKeys.length <= 1) {
        alert("최소 1개 이상의 노선은 유지되어야 합니다.");
        return;
      }
      if(!confirm(`"${routes[currentRouteId].name}" 노선을 정말 삭제하시겠습니까?`)) return;

      delete routes[currentRouteId];
      currentRouteId = Object.keys(routes)[0];
      syncRoutesToCloud();
      renderRouteSelect();
      updateMapRoute();
      renderStopList();
    }

    function moveStop(index, direction) {
      if(!isAdmin) return;
      const stops = routes[currentRouteId].stops;
      const targetIndex = index + direction;
      if(targetIndex < 0 || targetIndex >= stops.length) return;

      const temp = stops[index];
      stops[index] = stops[targetIndex];
      stops[targetIndex] = temp;

      syncRoutesToCloud();
      updateMapRoute();
      renderStopList();
    }

    function openLoginModal() { document.getElementById("modal-login").classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    function login() {
      const inputPw = document.getElementById("login-password").value;
      const storedPw = localStorage.getItem(ADMIN_PASSWORD_KEY);

      if(inputPw === storedPw) {
        isAdmin = true;
        closeModal("modal-login");
        document.getElementById("login-password").value = "";
        
        document.getElementById("user-badge").innerText = "기사님 (관리자 모드)";
        document.getElementById("user-badge").className = "badge-driver";
        document.getElementById("btn-login-modal").style.display = "none";
        document.getElementById("btn-change-pw-modal").style.display = "inline-flex";
        document.getElementById("btn-logout").style.display = "inline-flex";
        document.getElementById("driver-controls").style.display = "flex";
        document.getElementById("btn-add-stop-modal").style.display = "inline-flex";
        document.getElementById("sidebar-admin-actions").style.display = "flex";

        renderStopList();
        alert("기사님 관리자 모드로 로그인되었습니다.");
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }

    function logout() {
      isAdmin = false;
      document.getElementById("user-badge").innerText = "승객 (조회 전용)";
      document.getElementById("user-badge").className = "badge-passenger";
      document.getElementById("btn-login-modal").style.display = "inline-flex";
      document.getElementById("btn-change-pw-modal").style.display = "none";
      document.getElementById("btn-logout").style.display = "none";
      document.getElementById("driver-controls").style.display = "none";
      document.getElementById("btn-add-stop-modal").style.display = "none";
      document.getElementById("sidebar-admin-actions").style.display = "none";

      if(watchId) toggleGPS();
      renderStopList();
    }

    function openChangePwModal() {
      if(!isAdmin) return;
      document.getElementById("pw-current").value = "";
      document.getElementById("pw-new").value = "";
      document.getElementById("pw-new-confirm").value = "";
      document.getElementById("modal-change-pw").classList.add("active");
    }

    function saveNewPassword() {
      if(!isAdmin) return;
      const currentPw = document.getElementById("pw-current").value;
      const newPw = document.getElementById("pw-new").value;
      const confirmPw = document.getElementById("pw-new-confirm").value;
      const storedPw = localStorage.getItem(ADMIN_PASSWORD_KEY);

      if(currentPw !== storedPw) {
        alert("현재 비밀번호가 일치하지 않습니다.");
        return;
      }
      if(!newPw) {
        alert("새 비밀번호를 입력해주세요.");
        return;
      }
      if(newPw !== confirmPw) {
        alert("새 비밀번호 확인이 일치하지 않습니다.");
        return;
      }

      localStorage.setItem(ADMIN_PASSWORD_KEY, newPw);
      closeModal("modal-change-pw");
      alert("비밀번호가 성공적으로 변경되었습니다.");
    }

    function toggleGPS() {
      if(!isAdmin) return;
      const btn = document.getElementById("btn-toggle-gps");
      const dot = document.getElementById("gps-dot");
      const text = document.getElementById("gps-text");

      if(!watchId) {
        if(!navigator.geolocation) {
          alert("이 브라우저는 위치 서비스를 지원하지 않습니다.");
          return;
        }

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, speed } = pos.coords;
            sendBusPositionToCloud(latitude, longitude, speed);
          },
          (err) => alert("위치 정보를 가져올 수 없습니다: " + err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );

        btn.innerText = "🛑 위치 추적 중지";
        btn.classList.replace("btn-primary", "btn-secondary");
        dot.classList.add("active");
        text.innerText = "GPS 추적 중";
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = "📡 내 위치 추적 시작";
        btn.classList.replace("btn-secondary", "btn-primary");
        dot.classList.remove("active");
        text.innerText = "GPS 정지됨";
      }
    }

    function openAddStopModal() {
      if(!isAdmin) return;
      document.getElementById("modal-stop-title").innerText = "📍 정류장 추가";
      document.getElementById("stop-edit-id").value = "";
      document.getElementById("stop-name").value = "";
      document.getElementById("stop-scheduled-time").value = "";
      document.getElementById("stop-lat").value = "";
      document.getElementById("stop-lng").value = "";
      document.getElementById("modal-stop").classList.add("active");
    }

    function openEditStopModal(stopId) {
      if(!isAdmin) return;
      const stop = routes[currentRouteId].stops.find(s => s.id === stopId);
      if(!stop) return;

      document.getElementById("modal-stop-title").innerText = "✏️ 정류장 정보 수정";
      document.getElementById("stop-edit-id").value = stop.id;
      document.getElementById("stop-name").value = stop.name;
      document.getElementById("stop-scheduled-time").value = stop.scheduledTime || "";
      document.getElementById("stop-lat").value = stop.lat;
      document.getElementById("stop-lng").value = stop.lng;
      document.getElementById("modal-stop").classList.add("active");
    }

    function saveStop() {
      if(!isAdmin) return;
      const id = document.getElementById("stop-edit-id").value;
      const name = document.getElementById("stop-name").value.trim();
      const scheduledTime = document.getElementById("stop-scheduled-time").value.trim();
      const lat = parseFloat(document.getElementById("stop-lat").value);
      const lng = parseFloat(document.getElementById("stop-lng").value);

      if(!name || isNaN(lat) || isNaN(lng)) {
        alert("올바른 정류장 이름과 좌표를 입력해주세요.");
        return;
      }

      if(!routes[currentRouteId].stops) {
        routes[currentRouteId].stops = [];
      }

      if(id) {
        const stop = routes[currentRouteId].stops.find(s => s.id == id);
        if(stop) {
          stop.name = name;
          stop.scheduledTime = scheduledTime;
          stop.lat = lat;
          stop.lng = lng;
        }
      } else {
        const newStop = { id: Date.now(), name, lat, lng, scheduledTime };
        routes[currentRouteId].stops.push(newStop);
      }

      syncRoutesToCloud();
      closeModal("modal-stop");
      updateMapRoute();
      renderStopList();
    }

    function deleteStop(stopId) {
      if(!isAdmin) return;
      if(!confirm("해당 정류장을 삭제하시겠습니까?")) return;
      routes[currentRouteId].stops = routes[currentRouteId].stops.filter(s => s.id !== stopId);
      syncRoutesToCloud();
      updateMapRoute();
      renderStopList();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("승객용 접속 링크가 클립보드에 복사되었습니다!");
    }

    function toggleTheme() {
      isDarkTheme = !isDarkTheme;
      document.body.setAttribute("data-theme", isDarkTheme ? "dark" : "light");
      const themeBtn = document.getElementById("btn-theme");
      themeBtn.innerText = isDarkTheme ? "🌙" : "☀️";
    }
  </script>
</body>
</html>
